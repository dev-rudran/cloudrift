<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">cloudrift</title>
  <desc id="desc">cloudrift banner: Catch cloud misconfigurations before the apply.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22304f" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#2a3a5c"/>

  <g opacity="0.9">
    <path d="M0 238C150 196 240 268 386 234C532 200 618 250 760 222C902 194 1040 246 1200 206" fill="none" stroke="#1d2a47" stroke-width="2"/>
    <path d="M0 258C150 216 240 288 386 254C532 220 618 270 760 242C902 214 1040 266 1200 226" fill="none" stroke="#1d2a47" stroke-width="2"/>
  </g>

  <g transform="translate(84 96)">
    <rect x="0" y="-36" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="34" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5">cloudrift</text>
    <text x="3" y="76" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="400">Catch cloud misconfigurations before the apply.</text>
    <text x="3" y="122" fill="#fb923c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3.2">TERRAFORM &#183; KUBERNETES &#183; POLICY AS CODE</text>
  </g>

  <g transform="translate(985 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="78" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.55"/>
    <circle cx="0" cy="0" r="56" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.8"/>
    <path d="M-56 -26C-44 -62 -4 -82 30 -68C48 -61 57 -46 59 -28C82 -22 96 -2 92 18C88 38 68 50 46 48L-44 48C-70 48 -88 30 -88 8C-88 -10 -74 -24 -56 -26Z" fill="#0b1020" stroke="url(#accent)" stroke-width="3"/>
    <path d="M-44 18L-14 8L2 30L22 12L46 20" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="2" cy="30" r="5" fill="#fdba74"/>
