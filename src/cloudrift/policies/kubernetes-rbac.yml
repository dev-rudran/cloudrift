policies:
  - id: CLDR-1011
    title: RBAC role grants wildcard permissions
    description: >-
      A Role or ClusterRole rule uses a wildcard verb, resource, API group, or
      non-resource URL. Wildcards hide the effective permission set.
    severity: high
    provider: kubernetes
    resource:
      - kubernetes_role
      - kubernetes_cluster_role
    location: rules
    assert: >-
      not any(
        "*" in (rule.verbs or [])
        or "*" in (rule.resources or [])
        or "*" in (rule.apiGroups or [])
        or "*" in (rule.nonResourceURLs or [])
        for rule in (resource.rules or [])
      )
    message: RBAC role {address} grants wildcard permissions.
    remediation: >-
      List the specific verbs, resources, and API groups the workload needs.
      Split broad roles into focused roles and bind them to dedicated service
      accounts.
    references:
      - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
    tags: [kubernetes, rbac, least-privilege, cis-k8s-5.1.3]

  - id: CLDR-1012
    title: cluster-admin is bound to a non-system subject
    description: >-
      A RoleBinding or ClusterRoleBinding grants the cluster-admin ClusterRole
      to a user, group, or service account outside the system: namespace.
    severity: critical
    provider: kubernetes
    resource:
      - kubernetes_cluster_role_binding
      - kubernetes_role_binding
    location: subjects
    assert: >-
      not (
        resource.roleRef.name == "cluster-admin"
        and any(
          not startswith(subject.name or "", "system:")
          for subject in (resource.subjects or [])
        )
      )
    message: Binding {address} grants cluster-admin to a non-system subject.
    remediation: >-
      Bind a purpose-specific ClusterRole instead of cluster-admin. If full
      access is required, restrict it to a break-glass identity with audit
      logging and an approval process.
    references:
      - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#user-facing-roles
    tags: [kubernetes, rbac, cluster-admin, privilege-escalation]
