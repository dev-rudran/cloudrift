policies:
  - id: CLDR-1013
    title: Secret manifest contains literal data
    description: >-
      A Secret object embeds data or stringData directly in the manifest. The
      value is stored in Git or the manifest pipeline in plaintext or trivially
      decodable base64.
    severity: high
    provider: kubernetes
    resource: kubernetes_secret
    location:
      - data
      - stringData
    assert: not (resource.data or resource.stringData)
    message: Secret {address} embeds literal secret material.
    remediation: >-
      Create the Secret outside source control with External Secrets Operator,
      Sealed Secrets, or a CSI secrets store, and reference it from workloads.
    references:
      - https://kubernetes.io/docs/concepts/configuration/secret/
    tags: [kubernetes, secrets, credentials]

  - id: CLDR-1014
    title: Container environment contains a secret-like literal
    description: >-
      A container environment variable name suggests a credential and uses a
      literal value instead of a secretKeyRef. The value is visible in the pod
      spec and to anyone who can read the workload.
    severity: high
    provider: kubernetes
    resource:
      - kubernetes_pod
      - kubernetes_deployment
      - kubernetes_stateful_set
      - kubernetes_daemon_set
      - kubernetes_replica_set
      - kubernetes_replication_controller
      - kubernetes_job
      - kubernetes_cron_job
    location:
      - spec.template.spec.containers
      - spec.containers
      - spec.jobTemplate.spec.template.spec.containers
    assert: >-
      not any(
        env.value is not None
        and regex_match(env.name or "", "(?i)(password|passwd|secret|token|api[_-]?key|credential)")
        for container in resource.containers
        for env in (container.env or [])
      )
    message: Workload {address} sets a secret-like environment variable literally.
    remediation: >-
      Use valueFrom.secretKeyRef or valueFrom.configMapKeyRef, keep the Secret
      outside source control, and rotate any value that was committed.
    references:
      - https://kubernetes.io/docs/concepts/configuration/secret/#using-secrets-as-environment-variables
    tags: [kubernetes, secrets, configuration]
