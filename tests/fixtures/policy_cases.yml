      apiVersion: v1
      kind: Service
      metadata:
        name: web
        namespace: prod
      spec:
        type: LoadBalancer
        ports:
        - port: 80
  compliant:
  - manifest:
      apiVersion: v1
      kind: Service
      metadata:
        name: web
        namespace: prod
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-internal: 'true'
      spec:
        type: LoadBalancer
        ports:
        - port: 80
